name: Daily Automated Update

on:
  schedule:
    # Runs at 05:30 UTC every day
    # Format is: minute hour day-of-month month day-of-week
    - cron: '30 5 * * *'
  workflow_dispatch: # This allows you to trigger it manually for testing

jobs:
  automated_commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write # This permission is required to push commits
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Process update for 23f3001101@ds.study.iitm.ac.in
        run: |
          echo "Daily activity log - $(date)" >> activity_log.txt

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add activity_log.txt
          git commit -m "Automated daily update: $(date)"
          git push
